name: Dockerize and deploy

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm install
      - name: Build the application
        run: npm run build

  dockerize:
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'
      - name: Build and push Docker image
        run: |
          docker build -t node-server .
          docker tag node-server:latest ${{ secrets.DOCKER_USERNAME }}/node-server:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/node-server:latest
      - name: Log out from Docker Hub
        run: docker logout

  deploy:
    needs:
      - dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Configure SSH for EC2
      - name: Configure SSH for EC2
        run: |
          echo "${{ secrets.SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      # Step 2: SSH into EC2 instance and install Minikube and kubectl
      - name: Setup Minikube and kubectl on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            # Update and install Minikube and kubectl
            sudo apt update && sudo apt install -y apt-transport-https curl
            curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
            sudo mv minikube-linux-amd64 /usr/local/bin/minikube
            sudo chmod +x /usr/local/bin/minikube
            curl -LO https://storage.googleapis.com/kubernetes-release/release/v1.24.0/bin/linux/amd64/kubectl
            sudo mv kubectl /usr/local/bin/kubectl
            sudo chmod +x /usr/local/bin/kubectl
            # Start Minikube
            minikube start --driver=docker
            minikube status
          EOF

      # Step 3: Set up kubectl and deploy to Minikube
      - name: Deploy to Minikube on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
            # Set up kubectl config for Minikube
            mkdir -p $HOME/.kube
            cp /home/${{ secrets.EC2_USER }}/.minikube/profiles/minikube/config.json $HOME/.kube/config
            kubectl config use-context minikube

            # Deploy Kubernetes resources to Minikube
            kubectl apply -f kubernetes/mongo-statefulset.yaml
            kubectl apply -f kubernetes/mongo-service.yaml
            kubectl apply -f kubernetes/backend.yaml
            kubectl apply -f kubernetes/frontend.yaml

            # Check rollout status
            kubectl rollout status deployment/frontend
            kubectl rollout status deployment/backend
          EOF

      # Step 4: Cleanup local SSH key
      - name: Cleanup local SSH key
        run: rm ec2_key.pem
