name: Fullstack CI/CD Pipeline

on:
  push:
    branches:
      - feature
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Backend Docker image
      run: |
        docker build -t kelomo2502/backend:latest -f backend/Dockerfile ./backend
        docker push kelomo2502/backend:latest

    - name: Build and push Frontend Docker image
      run: |
        docker build -t kelomo2502/frontend:latest -f frontend/Dockerfile ./frontend
        docker push kelomo2502/frontend:latest

    - name: Configure SSH for EC2
      run: |
        echo "${{ secrets.SSH_KEY }}" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: SSH and Setup Minikube
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
        set -ex

        # Clean up old Minikube and set up environment
        sudo /usr/local/bin/minikube delete --all --purge || true
        sudo rm -rf ~/.minikube ~/.kube
        sudo -E /usr/local/bin/minikube start --driver=docker --force --extra-config=kubelet.cgroup-driver=systemd

        # Ensure kubectl is configured
        mkdir -p $HOME/.kube
        sudo cp -f /etc/kubernetes/admin.conf $HOME/.kube/config || true
        sudo chown -R $(id -u):$(id -g) $HOME/.kube

        # Verify Minikube is running
        kubectl cluster-info || { echo "Minikube is not running!"; exit 1; }
        kubectl get nodes
        EOF

    - name: Copy Kubernetes Manifests to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} "mkdir -p /home/ec2-user/kubernetes"
        scp -o StrictHostKeyChecking=no -i ec2_key.pem ./kubernetes/*.yaml ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }}:/home/ec2-user/kubernetes/

    - name: Deploy to Kubernetes
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'
        set -ex

        # Check Minikube is running before deploying
        kubectl cluster-info || { echo "Minikube is not running! Restarting..."; sudo -E /usr/local/bin/minikube start --driver=docker --force; }
        kubectl get nodes

        # Apply manifests with validation off as fallback
        kubectl apply --validate=true -f /home/ec2-user/kubernetes/ || kubectl apply --validate=false -f /home/ec2-user/kubernetes/

        kubectl rollout status deployment/backend
        kubectl rollout status deployment/frontend
        EOF

    - name: Cleanup SSH Key
      run: rm ec2_key.pem
