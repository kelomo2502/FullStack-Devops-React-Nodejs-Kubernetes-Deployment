name: Dockerize, Build, Push, and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'

      # Build and push the Backend Docker image
      - name: Build and push Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # Build and push the Frontend Docker image
      - name: Build and push Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      - name: Log out from Docker Hub
        run: docker logout

  deploy-to-kubernetes:
    needs:
      - dockerize
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 1: Install Minikube
      - name: Install Minikube
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo install minikube-linux-amd64 /usr/local/bin/minikube

      # Step 2: Install kubectl
      - name: Install kubectl
        run: |
          curl -LO https://dl.k8s.io/release/v1.24.0/bin/linux/amd64/kubectl
          sudo install kubectl /usr/local/bin/kubectl

      # Step 3: Start Minikube
      - name: Start Minikube
        run: |
          minikube start --driver=docker

      # Step 4: Configure kubectl to use Minikube's context
      - name: Set up kubectl configuration for Minikube
        run: |
          mkdir -p $HOME/.kube
          cp /etc/kubernetes/admin.conf $HOME/.kube/config
          kubectl config use-context minikube

      # Step 5: Deploy to Kubernetes (Minikube)
      - name: Deploy to Kubernetes
        run: |
          # Log into Docker Hub from EC2
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_PUBLIC_IP }} << 'EOF'

          # Backend Docker deployment to Kubernetes cluster
          kubectl set image deployment/backend backend=${{ secrets.DOCKER_USERNAME }}/backend:latest --record
          kubectl rollout status deployment/backend

          # Frontend Docker deployment to Kubernetes cluster
          kubectl set image deployment/frontend frontend=${{ secrets.DOCKER_USERNAME }}/frontend:latest --record
          kubectl rollout status deployment/frontend

          # Clean up unused Docker images
          docker system prune -af || true
          EOF

      - name: Cleanup local SSH key
        run: rm ec2_key.pem
