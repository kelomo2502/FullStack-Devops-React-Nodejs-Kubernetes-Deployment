name: Dockerize and Deploy to Kubernetes

on:
  push:
    branches:
      - main

jobs:
  dockerize:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3
        
      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: '${{ secrets.DOCKER_USERNAME }}'
          password: '${{ secrets.DOCKER_PASSWORD }}'

      # Step 3: Install dependencies and build the Backend
      - name: Install Backend dependencies
        run: |
          cd backend
          npm install
          npm run build

      # Step 4: Build and push the Backend Docker image
      - name: Build and push Backend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/backend:latest

      # Step 5: Install dependencies and build the Frontend
      - name: Install Frontend dependencies
        run: |
          cd frontend
          npm install
          npm run build

      # Step 6: Build and push the Frontend Docker image
      - name: Build and push Frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend:latest

      # Step 7: Log out from Docker Hub
      - name: Log out from Docker Hub
        run: docker logout

  deploy:
    needs: dockerize
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Install Minikube
      - name: Install Minikube
        shell: bash
        run: |
          curl -LO https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          sudo mv minikube-linux-amd64 /usr/local/bin/minikube
          sudo chmod +x /usr/local/bin/minikube
          minikube version

      # Step 3: Install kubectl
      - name: Install kubectl
        shell: bash
        run: |
          curl -LO "https://dl.k8s.io/release/v1.27.0/bin/linux/amd64/kubectl"
          sudo mv kubectl /usr/local/bin/kubectl
          sudo chmod +x /usr/local/bin/kubectl
          kubectl version --client

      # Step 4: Start Minikube
      - name: Start Minikube
        run: |
          minikube start
          mkdir -p $HOME/.kube
          cp $HOME/.minikube/profiles/minikube/config.json $HOME/.kube/config
          kubectl config use-context minikube

      # Step 5: Deploy Backend and Frontend to Kubernetes
      - name: Deploy to Minikube Kubernetes
        run: |
          # Apply Kubernetes configurations
          kubectl apply -f kubernetes/mongo-statefulset.yaml
          kubectl apply -f kubernetes/mongo-service.yaml
          kubectl apply -f kubernetes/backend.yaml
          kubectl apply -f kubernetes/frontend.yaml

      # Step 6: Check Rollout Status
      - name: Check Rollout Status
        run: |
          kubectl rollout status deployment/frontend
          kubectl rollout status deployment/backend

      # Step 7: Clean up SSH Key (if used for deployment)
      - name: Cleanup local SSH key
        run: rm ec2_key.pem
